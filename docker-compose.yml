services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelajak
      POSTGRES_PASSWORD: kelajak
      POSTGRES_DB: kelajak
    ports:
      - "5433:5432"
    volumes:
      - kelajak_pg:/var/lib/postgresql/data
      - ./server/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelajak -d kelajak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - kelajak_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kelajak_pg:
  kelajak_redis:
