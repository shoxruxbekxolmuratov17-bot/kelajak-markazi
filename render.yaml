# Render — Web + API bir xil servisda (tavsiya)
# kelajak-api.onrender.com — sayt ham, API ham shu yerda

services:
  - type: web
    name: kelajak-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # Eski alohida static sayt (ixtiyoriy — kelajak-api ishlatish osonroq)
  - type: web
    name: kelajak-web
    runtime: static
    buildCommand: npm install && VITE_API_URL=/api npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kelajak-api.onrender.com/api/*
